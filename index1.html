<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blush Bazaar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌸 Blush Bazaar</h1>
    <nav>
      <button onclick="showCategory('dresses')">Dresses</button>
      <button onclick="showCategory('shoes')">Shoes</button>
      <button onclick="showCategory('accessories')">Accessories</button>
      <button onclick="showCategory('cart')">Cart</button>
    </nav>
  </header>

  <!-- Product Categories -->
  <section id="dresses" class="category">
    <h2>👗 Dresses</h2>
    <div class="product">
      <img src="https://via.placeholder.com/150/ff69b4" alt="Pink Dress">
      <h3>Pink Dress</h3>
      <p>$25</p>
      <button onclick="addToCart('Pink Dress', 25)">Add to Cart</button>
    </div>
  </section>

  <section id="shoes" class="category" style="display:none;">
    <h2>👠 Shoes</h2>
    <div class="product">
      <img src="https://via.placeholder.com/150/ff69b4" alt="Pink Shoes">
      <h3>Pink Shoes</h3>
      <p>$40</p>
      <button onclick="addToCart('Pink Shoes', 40)">Add to Cart</button>
    </div>
  </section>

  <section id="accessories" class="category" style="display:none;">
    <h2>💍 Accessories</h2>
    <div class="product">
      <img src="https://via.placeholder.com/150/ff69b4" alt="Pink Bag">
      <h3>Pink Bag</h3>
      <p>$30</p>
      <button onclick="addToCart('Pink Bag', 30)">Add to Cart</button>
    </div>
  </section>

  <!-- Cart Section -->
  <section id="cart" class="category" style="display:none;">
    <h2>🛒 Your Cart</h2>
    <ul id="cart-items"></ul>
    <p id="total">Total: $0</p>
    <button id="buy-now" onclick="buyNow()">Buy Now</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
